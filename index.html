<title>Who Did This?! Cat Chaos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Układ: jedna pionowa scena na cały ekran telefonu; pasek gry i podpowiedź leżą na scenie, dom i wynik to arkusze nad nią. Jeden, wieczorny wygląd. */
:root{
  color-scheme:dark;
  --bg:#17132a; --panel:#2a2443; --panel-2:#372f58; --line:#4b4172;
  --ink:#f5eede; --muted:#b9afd2;
  --lamp:#f4b740; --lamp-ink:#2b1c03; --rose:#ee7f93; --mint:#86d0ae; --sky:#7fb6d9;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.4;
  padding-block:10px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:560px;margin:0 auto}
.stage{position:relative;margin:0 auto;border-radius:22px;overflow:hidden;background:#000;box-shadow:0 0 0 3px var(--line),0 20px 60px rgba(0,0,0,.5)}
canvas{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;border-radius:12px;padding:9px 14px;font-weight:800;background:var(--panel-2)}
button:focus-visible,input:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--lamp);color:var(--lamp-ink);font-family:var(--display);font-size:1.2rem;padding:9px 24px;box-shadow:0 4px 0 #a8770f}
button.primary:active{transform:translateY(2px);box-shadow:0 2px 0 #a8770f}
h1{font-family:var(--display);font-weight:800;font-size:1.9rem;line-height:1;margin:0}
h1 span{color:var(--lamp)}
h2{font-family:var(--display);font-size:1.2rem;margin:0;line-height:1.15;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted);font-size:.9rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row > *{min-width:0}
.spacer{flex:1}

/* pasek gry */
.hud{position:absolute;inset:0 0 auto 0;padding:10px 12px 22px;display:flex;flex-direction:column;gap:6px;background:linear-gradient(#17132aee,#17132a00);pointer-events:none;font-family:var(--display);font-weight:800}
.hud[hidden],.sheet[hidden]{display:none}
.hud-row{display:flex;align-items:center;gap:10px;font-size:1.5rem;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 2px 0 #17132a}
.hud-row #quit{pointer-events:auto;padding:4px 10px;font-size:1rem;background:#17132acc}
.hud-row .t{margin-left:auto}
.hud-row .t.warn{color:var(--rose)}
.hud-sub{display:flex;align-items:center;gap:10px;font-size:.9rem}
.st3{letter-spacing:.08em;color:#ffffff40}
.st3 b{color:var(--lamp)}
.meter{position:relative;flex:1;height:14px;border-radius:99px;background:#17132acc;overflow:hidden;box-shadow:0 0 0 2px #ffffff22}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--rose),var(--lamp));border-radius:99px}
.meter.on{box-shadow:0 0 0 2px var(--lamp),0 0 14px var(--lamp)}
.meter span{position:absolute;inset:0;display:grid;place-items:center;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:#fff;text-shadow:0 1px 0 #17132a}
.pips{display:flex;gap:5px}
.pips i{width:12px;height:12px;border-radius:50%;background:#17132acc;box-shadow:0 0 0 2px #ffffff33}
.pips i.ok{background:var(--mint);box-shadow:0 0 0 2px #fff}
.fishc{color:var(--lamp)}
.coach{margin:8px auto 0;height:72px;box-sizing:border-box;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:6px 12px;font-weight:800;font-size:.92rem;line-height:1.25;display:flex;gap:8px;align-items:center;overflow:hidden}
.coach:empty{visibility:hidden}
.coach.tut,.coach.gold{border-color:var(--lamp)}
.coach.warn{border-color:var(--rose);color:var(--rose)}
.coach small{color:var(--lamp);white-space:nowrap}

/* arkusze */
.sheet{position:absolute;inset:0;overflow-y:auto;background:#17132ad9;padding:16px 14px 20px;display:flex;flex-direction:column;gap:12px}
.sheet.low{inset:auto 0 0 0;max-height:66%;border-radius:22px 22px 0 0;background:#1d1836f5;box-shadow:0 -3px 0 var(--line)}
.sheet.mid{justify-content:center}
.card{background:var(--panel);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.card.gold{background:linear-gradient(135deg,#5a4313,#3a2d55);box-shadow:0 0 0 2px var(--lamp)}
.card.locked{opacity:.6}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{padding:6px 11px;border-radius:999px;color:var(--muted);background:transparent;font-size:.92rem}
.tabs button[aria-pressed="true"]{background:var(--panel-2);color:var(--ink)}
.coins{font-family:var(--display);font-weight:800;color:var(--lamp);font-size:1.15rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:9px;border-radius:99px;background:var(--panel-2);overflow:hidden;flex:1;min-width:80px}
.bar i{display:block;height:100%;background:var(--mint);border-radius:99px}
.stars{font-size:1.5rem;letter-spacing:.08em;color:var(--line);line-height:1}
.stars b{color:var(--lamp);display:inline-block}
.stars.pop b{animation:pop .45s both}
.stars.pop b:nth-child(2){animation-delay:.25s}.stars.pop b:nth-child(3){animation-delay:.5s}
@keyframes pop{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.5)}100%{transform:scale(1)}}
.big{font-family:var(--display);font-weight:800;font-size:2.6rem;line-height:1;color:var(--lamp);font-variant-numeric:tabular-nums}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.list li{display:flex;gap:8px;align-items:center;background:var(--panel-2);border-radius:10px;padding:7px 10px;font-weight:700}
.list li.ok{background:#2f5a48}
.list.stl li i{flex:none;width:3.3em;text-align:left;color:var(--lamp);letter-spacing:.05em}
.list li i{font-style:normal;width:1.2em;text-align:center;color:var(--mint)}
.list li span:last-child{margin-left:auto;color:var(--lamp);font-weight:800;white-space:nowrap}
.list li span:first-of-type{margin-left:0;color:inherit;font-weight:700;white-space:normal}
.note{border-left:4px solid var(--lamp);padding:2px 0 2px 10px;font-size:.95rem}
.note.done{border-color:var(--mint)}
.note.rose{border-color:var(--rose)}
.days{display:flex;gap:5px}
.days i{flex:1;height:8px;border-radius:9px;background:var(--panel-2)}
.days i.ok{background:var(--lamp)}
.up{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.up .lv{display:flex;gap:3px}
.up .lv i{width:16px;height:7px;border-radius:4px;background:var(--panel-2)}
.up .lv i.ok{background:var(--mint)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.tro{background:var(--panel);border-radius:12px;padding:8px;text-align:center;font-weight:700;font-size:.8rem}
.tro .e{font-size:1.6rem;line-height:1.2;display:block}
.tro.locked{opacity:.38}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.album figure{margin:0;background:var(--panel);border-radius:12px;overflow:hidden}
.album img{display:block;width:100%}
.album figcaption{padding:5px 8px;font-size:.75rem;color:var(--muted);font-weight:700}
input[type=text]{font:inherit;color:var(--ink);background:var(--panel-2);border:2px solid var(--line);border-radius:12px;padding:9px 12px;width:100%;box-sizing:border-box}
.appicon{width:68px;height:68px;border-radius:22%;box-shadow:0 0 0 2px var(--line);flex:none}
.appicon.sm{width:46px;height:46px}
.sheet.title{align-items:center;text-align:center;gap:14px}
.sheet.title .appicon{width:124px;height:124px}
.sheet.title h1{font-size:2.5rem}
.sheet.title > button{min-width:230px}
button.primary.big{font-size:1.45rem;padding:13px 30px}
.tag{font-family:var(--display);font-weight:800;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;font-size:.78rem}
.lv-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.lvb{padding:7px 0 5px;border-radius:12px;display:flex;flex-direction:column;align-items:center;font-family:var(--display);font-size:1.1rem;line-height:1.05}
.lvb small{font-size:.62rem;color:var(--lamp);letter-spacing:.04em;min-height:1em}
.lvb.cur{box-shadow:0 0 0 2px var(--lamp);background:#4a3f1f}
.sw{width:44px;height:44px;border-radius:50%;padding:0;border:3px solid transparent}
.sw[aria-pressed="true"]{border-color:var(--lamp)}
.catpick{flex:1;min-width:86px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 6px;border:3px solid transparent;background:var(--panel-2);font-size:.88rem;text-transform:capitalize}
.catpick[aria-pressed="true"]{border-color:var(--lamp);background:#4a3f1f;color:var(--lamp)}
.catpick i{display:block;width:71px;height:83px;background-size:403px 225.5px;background-position:-6.5px -9px;background-repeat:no-repeat}
.acc button[aria-pressed="true"]{background:var(--lamp);color:var(--lamp-ink)}
.pkg{animation:wig 1.2s infinite}
@keyframes wig{0%,100%{transform:rotate(0)}10%{transform:rotate(-3deg)}20%{transform:rotate(3deg)}30%{transform:rotate(0)}}
@media (prefers-reduced-motion:reduce){.pkg,.stars.pop b{animation:none}button.primary:active{transform:none}}
</style>

</head>
<body>

<script>
(() => {
'use strict';
const W=480,H=820,FLOOR=730,CEIL=96,CR=18,G=1500;
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d'),sheet=$('sheet'),stageEl=$('stage'),hud=$('hud'),coach=$('coach');

const IM={};
['bg_salon','bg_kuchnia','cat','cat_szary','cat_czarny','cat_maka','cat2','cat2_szary','cat2_czarny','cat2_maka','furn','props','kitchen','people','debris','bg_biuro','office','extra'].forEach(n=>{const i=new Image();i.onload=()=>{i.ok=true};i.src='a/'+n+'.webp';IM[n]=i});
let artOk=false;
const ART=()=>artOk||(artOk=Object.values(IM).every(i=>i.ok));

const OS={mug:['props',['mug0','mug1','mug2','mug3'],29,'b'],book:['props',['book0','book1'],24,'b'],plant:['props',['plant'],42,'b'],laptop:['props',['laptop'],50,'b'],vase:['props',['vase'],38,'b'],cake:['props',['cake'],44,'b'],
  frame:['props',['frame0','frame1'],44,'c'],pillow:['props',['pillow'],38,'b'],remote:['props',['remote'],32,'b'],yarn:['props',['yarn'],34,'b'],gift:['props',['gift0','gift1'],36,'b'],star:['props',['star'],36,'c'],bauble:['props',['bauble0','bauble1','bauble2','bauble3'],19,'c'],

  monitor:['office',['monitor'],60,'b'],keyboard:['office',['keyboard'],46,'b'],printer:['office',['printer'],52,'b'],lamp:['office',['lamp'],44,'b'],papers:['office',['papers'],40,'b'],pencils:['office',['pencils'],30,'b'],
  binder:['office',['binder0','binder1','binder2'],20,'b'],globe:['office',['globe'],40,'b'],trophy:['office',['trophy'],36,'b'],cactus:['office',['cactus'],36,'b'],clock:['office',['clock'],42,'c']};
const DEB={mug:['mug0','mug1','mug2','mug3'],plate:['plate'],vase:['vase'],bauble:['bauble0','bauble1','bauble2','bauble3'],jar:['jar'],cake:['cake']},DEBW={mug:46,plate:46,vase:62,bauble:34,jar:48,cake:54};

const HEAD={walk2:[.68,.12],land:[.72,.28],swat:[.60,.10],lick:[.56,.09],smug:[.50,.14],sit:[.56,.09],walk:[.68,.12],crouch:[.72,.28],leap:[.76,.12],hang:[.36,.06],scared:[.70,.36],zoom:[.72,.24]};
function drawObjArt(o){
  const d=OS[o.type];let x=o.x,y=o.y;if(o.att){const p=treePt(o.rx,o.rh);x=p.x;y=p.y}
  const done=o.state==='done'&&!o.keep;
  if(done&&DEB[o.type]){const n=DEB[o.type];sp('debris',n[Math.floor(o.hue*n.length)],o.x,FLOOR+3,DEBW[o.type]);return true}

function drawCatArt(c){
  const suf=floured>0?'_maka':S.color==='szary'?'_szary':S.color==='czarny'?'_czarny':'';

  else if(c.state==='air'){const hgt=clamp((FLOOR-c.y)/500,0,1);shadow(c.x,FLOOR+1,26-hgt*13,.26-hgt*.17)}

  roomId=id;LV=li==null?null:mkLV(id,li);setup();if(!LV)pickMissions();else missions=[];peekTimes=peekPlan();mode='play';tut=null;intro=0;
  const tgt=()=>{if(!LV||goalDone)return null;const ty=LV.type,ob=n=>objs.find(o=>o.type===n&&o.state==='static'&&!o.att);let o=null;
    if(ty==='fan')return FAN&&[FAN.x+rnd(-40,40),FAN.y+12];if(ty==='tree'||ty==='baub')return tree&&!tree.fallen?[tree.bx+rnd(-30,30),FLOOR-rnd(90,200)]:null;

    if(ty==='chair')return[345,668];o=ob({paper:'printer',monitor:'monitor',globe:'globe',pans:'pan',plates:'plate',prints:'flour'}[ty]);return o?[o.x,o.y]:null};

function sayTest(list){const fs=clamp(W/(cv.clientWidth||W),1,1.5),bad=[];let before=0,total=0;
